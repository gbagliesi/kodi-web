# Used by the "Aggiorna il Worker Cloudflare" GitHub Action (.github/workflows/worker.yml).
# The name must match the Worker created in the Cloudflare dashboard (docs/CLOUDFLARE.md).
name = "salotto-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true
# Keep the variables set in the dashboard (ALLOWED_ORIGINS…). Secrets such as TOKEN are never touched.
keep_vars = true

# Phone remote: one Durable Object per paired screen relays the remote's commands
# (free plan: SQLite-backed Durable Objects).
[[durable_objects.bindings]]
name = "REMOTE"
class_name = "RemoteRoom"

[[migrations]]
tag = "remote-v1"
new_sqlite_classes = ["RemoteRoom"]
