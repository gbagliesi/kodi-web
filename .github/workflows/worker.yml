# Publishes cloudflare/worker.js to the Cloudflare Worker whenever it changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/CLOUDFLARE.md).
# Optional repository variable CF_WORKER_NAME if the Worker is not called "salotto-proxy".
name: Aggiorna il Worker Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Controlla i secret
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID non impostati, Worker non aggiornato (vedi docs/CLOUDFLARE.md)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Pubblica il Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --name ${{ vars.CF_WORKER_NAME || 'salotto-proxy' }}
