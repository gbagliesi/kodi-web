# Publishes the web app on GitHub Pages at every push to main, and every few hours to
# refresh the TV guide (epg/it.json) built from a public XMLTV listing.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are two jobs (as in GitHub's own Pages workflow): deploying in the same job
  # right after the upload often failed with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html remote.html remote manifest.webmanifest sw.js css js icons addons docs README.md _site/
          BUILD="$(git rev-parse --short HEAD) $(TZ=Europe/Rome date +'%d/%m %H:%M')"
          sed -i "s|__BUILD__|${BUILD}|" _site/js/version.js
          sed -i "s|__BUILD__|$(git rev-parse --short HEAD)|g" _site/sw.js _site/index.html _site/remote/index.html
      - name: Prepara la guida TV
        # If the listing cannot be downloaded, keep the guide that is online now.
        run: |
          node tools/build-epg.mjs _site/epg/it.json || {
            echo "::warning::Guida TV non aggiornata, tengo quella pubblicata"
            mkdir -p _site/epg
            curl -fsSL -o _site/epg/it.json https://gbagliesi.github.io/kodi-web/epg/it.json || rm -f _site/epg/it.json
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
