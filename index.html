<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salotto">
  <title>Salotto · media center</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css?v=__BUILD__">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Menu principale">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <span>Salotto</span>
      </div>
      <nav id="menu"></nav>
      <div class="clock" id="clock"></div>
      <div class="app-version" id="app-version"></div>
    </aside>
    <main id="main">
      <header id="topbar">
        <button class="icon-btn focusable" id="back-btn" aria-label="Indietro" hidden>&#8592;</button>
        <div id="crumbs"></div>
        <div class="spacer"></div>
        <button class="icon-btn focusable" id="search-btn" aria-label="Cerca" hidden>&#128269;</button>
        <button class="icon-btn focusable" id="view-btn" aria-label="Cambia vista" hidden>&#9638;</button>
      </header>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="player" class="player" hidden>
    <div class="player-stage">
      <video id="video" playsinline webkit-playsinline x-webkit-airplay="allow" preload="metadata"></video>
      <div class="player-audio-art" id="audio-art" hidden>
        <img id="audio-art-img" alt="">
      </div>
    </div>
    <div class="player-ui" id="player-ui">
      <div class="player-top">
        <button class="icon-btn focusable" id="pl-close" aria-label="Chiudi">&#10005;</button>
        <div class="player-title" id="pl-title"></div>
        <button class="icon-btn focusable" id="pl-cast" aria-label="Trasmetti a TV o altoparlante" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10zm20-7H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg></button>
        <button class="icon-btn focusable" id="pl-chlist" aria-label="Elenco canali" hidden>&#9776;</button>
        <button class="icon-btn focusable" id="pl-fav" aria-label="Preferito">&#9734;</button>
      </div>
      <div class="player-bottom">
        <div class="seek-row">
          <span id="pl-cur">0:00</span>
          <input type="range" id="pl-seek" class="focusable" min="0" max="1000" value="0" aria-label="Posizione">
          <button type="button" class="live-btn focusable" id="pl-dur" aria-label="Torna alla diretta">0:00</button>
        </div>
        <div class="ctrl-row">
          <button class="icon-btn focusable ch-btn" id="pl-chdown" aria-label="Canale precedente" hidden>CH &#8722;</button>
          <button class="icon-btn focusable" id="pl-rew" aria-label="Indietro 10 secondi">&#8634; 10</button>
          <button class="icon-btn big focusable" id="pl-play" aria-label="Riproduci/Pausa">&#9654;</button>
          <button class="icon-btn focusable" id="pl-fwd" aria-label="Avanti 30 secondi">30 &#8635;</button>
          <button class="icon-btn focusable ch-btn" id="pl-chup" aria-label="Canale successivo" hidden>CH +</button>
          <div class="spacer"></div>
          <input type="range" id="pl-vol" class="focusable" min="0" max="100" value="100" aria-label="Volume">
          <button class="icon-btn focusable" id="pl-fs" aria-label="Schermo intero">&#9974;</button>
        </div>
      </div>
      <div class="player-msg" id="pl-msg" hidden></div>
    </div>
    <div class="player-osd" id="pl-osd" hidden><span class="osd-num" id="pl-osd-num"></span><span class="osd-name" id="pl-osd-name"></span></div>
    <div class="player-channels" id="pl-channels" hidden>
      <div class="channels-head">
        <input type="text" id="pl-chnum" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Numero" aria-label="Vai al canale numero" autocomplete="off">
        <button class="icon-btn focusable" id="pl-chclose" aria-label="Chiudi elenco canali">&#10005;</button>
      </div>
      <div class="channels-list" id="pl-chitems"></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js?v=__BUILD__"></script>
</body>
</html>
